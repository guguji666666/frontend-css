<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>我要创造一个有琳的世界</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        background: #123;
        height: 100vh;
      }
      .base {
        min-height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #123;
      }
      .eyeleft {
        margin: 100px;
        background-color: #fff;
        transform: rotate(55deg);
        border-radius: 25px;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 300px;
        height: 300px;
        border: 3px solid #000;
        border-top: 10px solid #000;
        border-radius: 80% 10% 80% 0%;
        -webkit-box-shadow: 0px 15px 35px -5px rgba(50, 88, 130, 0.32);
        -moz-box-shadow: 0px 15px 35px -5px rgba(50, 88, 130, 0.32);
        box-shadow: 0px 15px 35px -5px rgba(50, 88, 130, 0.32);
      }
      .eyeright {
        margin: 100px;
        background-color: #fff;
        transform: rotate(35deg);
        border-radius: 25px;
        display: flex;
        overflow: hidden;
        border: 3px solid #000;
        border-left: 10px solid #000;
        justify-content: center;
        align-items: center;
        width: 300px;
        height: 300px;
        border-radius: 80% 0% 80% 10%;
        -webkit-box-shadow: 0px 15px 35px -5px rgba(50, 88, 130, 0.32);
        -moz-box-shadow: 0px 15px 35px -5px rgba(50, 88, 130, 0.32);
        box-shadow: 0px 15px 35px -5px rgba(50, 88, 130, 0.32);
      }
      .eyem {
        background-color: #bf96d0;
      }
      @keyframes round {
        0% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(-90deg);
        }
        50% {
          transform: rotate(-180deg);
        }
        100% {
          transform: rotate(-360deg);
        }
      }
      .sharingano-div {
        border: none;
        background: transparent;
        display: flex;
        border-radius: 50%;
      }

      .sharingano {
        position: relative;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        border: 6px solid #131212;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #a73a3a;
        overflow: hidden;
        -webkit-transition: 0.7s ease;
        -moz-transition: 0.7s ease;
        -o-transition: 0.7s ease;
        -webkit-box-shadow: inset 0 0 30px #231e1f;

        animation: 10s round infinite linear;
      }
      .inner-red {
        border-radius: 50%;
        width: 20%;
        height: 20%;
        z-index: 50;
        position: absolute;
        background-color: #a73a3a;
        overflow: hidden;
      }
      .inner-black {
        width: 70%;
        height: 70%;
        border-radius: 50%;
        border: 3px solid #131212;
        background-color: #a73a3a;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 10;
      }
      .inner-full-black {
        border-radius: 50%;
        background-color: #131212;
        width: 45%;
        height: 45%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tomoe {
        position: absolute;
        width: 15%;
        height: 50%;
        background-color: #131212;
        border-radius: 50%;
        z-index: 15;
      }

      .t1 {
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        -moz-transform: translateX(-50%);
        -ms-transform: translateX(-50%);
        -o-transform: translateX(-50%);
        -webkit-transform: translateX(-50%);
      }
      .roundt1 {
        width: 30%;
        height: 65%;
        border-radius: 50%;
        position: absolute;
        top: 0;
        left: 35%;
        background-color: #131212;
        z-index: 5;
        transform: rotateZ(-30deg);
        -moz-transform: rotateZ(-30deg);
        -moz-transform: rotateZ(-30deg);
        -ms-transform: rotateZ(-30deg);
        -o-transform: rotateZ(-30deg);
        -webkit-transform: rotateZ(-30deg);
        transform-origin: top;
        -moz-transform-origin: top;
        -ms-transform-origin: top;
        -o-transform-origin: top;
        -webkit-transform-origin: top;
      }

      .t2 {
        left: 20%;
        bottom: 10%;
        transform: rotateZ(55deg);
        -moz-transform: rotateZ(55deg);
        -ms-transform: rotateZ(55deg);
        -o-transform: rotateZ(55deg);
        -webkit-transform: rotateZ(55deg);
      }

      .roundt2 {
        width: 30%;
        height: 65%;
        border-radius: 50%;
        position: absolute;
        right: -5%;
        bottom: -44%;
        background-color: #131212;
        z-index: 5;
        transform: rotateZ(96deg);
        -moz-transform: rotateZ(96deg);
        -ms-transform: rotateZ(96deg);
        -o-transform: rotateZ(96deg);
        -webkit-transform: rotateZ(96deg);
        transform-origin: top;
        -moz-transform-origin: top;
        -ms-transform-origin: top;
        -o-transform-origin: top;
        -webkit-transform-origin: top;
      }

      .t3 {
        right: 20%;
        bottom: 10%;
        transform: rotateZ(-55deg);
        -moz-transform: rotateZ(-55deg);
        -ms-transform: rotateZ(-55deg);
        -o-transform: rotateZ(-55deg);
        -webkit-transform: rotateZ(-55deg);
      }

      .roundt3 {
        width: 30%;
        height: 65%;
        border-radius: 50%;
        position: absolute;
        left: -5%;
        bottom: -44%;
        background-color: #131212;
        transform: rotateZ(205deg);
        -moz-transform: rotateZ(205deg);
        -ms-transform: rotateZ(205deg);
        -o-transform: rotateZ(205deg);
        -webkit-transform: rotateZ(205deg);
        transform-origin: top;
        -moz-transform-origin: top;
        -ms-transform-origin: top;
        -o-transform-origin: top;
        -webkit-transform-origin: top;
        z-index: 5;
      }

      .t1::before {
        content: "";
        position: absolute;
        bottom: 0;
        left: -50%;
        width: 40%;
        height: 80%;
        background-color: #131212;
        transform-origin: bottom center;
        -ms-transform-origin: bottom center;
        -o-transform-origin: bottom center;
        -webkit-transform-origin: bottom center;
        -moz-transform-origin: bottom center;
        transform: rotateZ(13deg);
        -moz-transform: rotateZ(13deg);
        -ms-transform: rotateZ(13deg);
        -o-transform: rotateZ(13deg);
        -webkit-transform: rotateZ(13deg);
      }

      .t1::after {
        content: "";
        position: absolute;
        bottom: 0;
        right: -50%;
        width: 40%;
        height: 80%;
        background-color: #131212;
        transform-origin: bottom center;
        -ms-transform-origin: bottom center;
        -o-transform-origin: bottom center;
        -webkit-transform-origin: bottom center;
        -moz-transform-origin: bottom center;
        transform: rotateZ(-13deg);
        -moz-transform: rotateZ(-13deg);
        -ms-transform: rotateZ(-13deg);
        -o-transform: rotateZ(-13deg);
        -webkit-transform: rotateZ(-13deg);
      }

      .t2::before {
        content: "";
        position: absolute;
        top: 0;
        left: -50%;
        width: 41%;
        height: 80%;
        background-color: #131212;
        transform-origin: top center;
        -moz-transform-origin: top center;
        -ms-transform-origin: top center;
        -o-transform-origin: top center;
        -webkit-transform: top center;
        transform: rotateZ(-13deg);
        -moz-transform: rotateZ(-13deg);
        -ms-transform: rotateZ(-13deg);
        -o-transform: rotateZ(-13deg);
        -webkit-transform: rotateZ(-13deg);
      }

      .t2::after {
        content: "";
        position: absolute;
        top: 0;
        right: -50%;
        width: 40%;
        height: 80%;
        background-color: #131212;
        transform-origin: top center;
        -moz-transform-origin: top center;
        -ms-transform-origin: top center;
        -o-transform-origin: top center;
        -webkit-transform: top center;
        transform: rotateZ(13deg);
        -moz-transform: rotateZ(13deg);
        -ms-transform: rotateZ(13deg);
        -o-transform: rotateZ(13deg);
        -webkit-transform: rotateZ(13deg);
      }

      .t3::before {
        content: "";
        position: absolute;
        top: 0;
        left: -50%;
        width: 41%;
        height: 80%;
        background-color: #131212;
        transform-origin: top center;
        -moz-transform-origin: top center;
        -ms-transform-origin: top center;
        -o-transform-origin: top center;
        -webkit-transform: top center;
        transform: rotateZ(-13deg);
        -moz-transform: rotateZ(-13deg);
        -ms-transform: rotateZ(-13deg);
        -o-transform: rotateZ(-13deg);
        -webkit-transform: rotateZ(-13deg);
      }

      .t3::after {
        content: "";
        position: absolute;
        top: 0;
        right: -50%;
        width: 40%;
        height: 80%;
        background-color: #131212;
        transform-origin: top center;
        -moz-transform-origin: top center;
        -ms-transform-origin: top center;
        -o-transform-origin: top center;
        -webkit-transform: top center;
        transform: rotateZ(13deg);
        -moz-transform: rotateZ(13deg);
        -ms-transform: rotateZ(13deg);
        -o-transform: rotateZ(13deg);
        -webkit-transform: rotateZ(13deg);
      }
      .rinnegan {
        position: absolute;
        width: 55%;
        left: 50px;
        top: 55px;
        height: 55%;
        border-radius: 50%;
        border: 3px solid black;
      }

      .rinnegan:nth-child(1) {
        transform: scale(1.5);
      }

      .rinnegan:nth-child(2) {
        transform: scale(1.2);
      }

      .rinnegan:nth-child(3) {
        transform: scale(0.9);
      }

      .rinnegan:nth-child(4) {
        transform: scale(0.7);
      }

      .rinnegan:nth-child(5) {
        transform: scale(0.4);
        -webkit-box-shadow: inset 0 0 30px #231e1f;
        border: 4px solid black;
        background: #936da3;
      }
      .rinnegan:nth-child(6) {
        transform: scale(1.9);
        border: 4px solid black;
      }
      .rinnegan:nth-child(7) {
        transform: scale(0.15);
        background: #000;
        border: 4px solid black;
      }
      @media (max-width: 768px) {
        .base {
          display: block;
        }
      }
    </style>
  <meta name="source" content="https://www.fecoder.cn/code-fun/css-eye-animation-sharingan-rinnegan">
</head>
  <body>
    <div class="base">
      <div class="eyeleft">
        <div class="sharingano-div">
          <span class="sharingano">
            <span class="inner-red"></span>
            <span class="inner-black">
              <span class="inner-full-black"></span>
            </span>

            <span class="tomoe t1"></span>
            <span class="tomoe t2"></span>
            <span class="tomoe t3"></span>

            <span class="roundt1"></span>
            <span class="roundt2"></span>
            <span class="roundt3"></span>
          </span>
        </div>
      </div>
      <div class="eyeright eyem">
        <div class="rinnegan"></div>
        <div class="rinnegan"></div>
        <div class="rinnegan"></div>
        <div class="rinnegan"></div>
        <div class="rinnegan"></div>
        <div class="rinnegan"></div>
        <div class="rinnegan"></div>
      </div>
    </div>
  </body>
</html>
